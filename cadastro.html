<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cadastro</title>

  <link
    rel="icon"
    type="image/png"
    href="./assets/images/logo.png"
  >

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./js/api.js"></script>
  <script src="./js/header.js"></script>

</head>

<body class="bg-gray-100 text-gray-800">

  <!-- HEADER compartilhado (gerado por js/header.js) -->
  <div id="header-root" data-voltar="index.html"></div>

  <!-- MAIN -->
  <main class="container mx-auto pt-44 pb-16 px-6">

    <section class="bg-white p-8 rounded-xl shadow-lg max-w-xl mx-auto">

      <h2 class="text-4xl font-bold mb-6">
        Criar Conta
      </h2>

      <!-- FORM -->
      <form id="form-cadastro" class="space-y-5">

        <!-- NOME -->
        <div>
          <label for="nome" class="block mb-2 font-semibold">Nome completo <span class="text-red-600">*</span></label>
          <input type="text" id="nome" required placeholder="Digite seu nome completo"
            class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- EMAIL -->
        <div>
          <label for="email" class="block mb-2 font-semibold">Email <span class="text-red-600">*</span></label>
          <input type="email" id="email" required placeholder="seu@email.com"
            class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- TELEFONE -->
        <div>
          <label for="telefone" class="block mb-2 font-semibold">
            Telefone / WhatsApp <span class="text-red-600">*</span>
          </label>
          <input type="tel" id="telefone" required placeholder="+55 82 9 9655-8114"
            class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <p class="text-xs text-gray-400 mt-1">Formato internacional: +55 (DDD) número</p>
        </div>

        <!-- TIPO DE DOCUMENTO -->
        <div>
          <label class="block mb-2 font-semibold">Você é brasileiro(a)? <span class="text-red-600">*</span></label>
          <div class="flex gap-4">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="nacionalidade" value="brasileiro" checked
                class="accent-blue-600 w-4 h-4" onchange="alternarDocumento(this.value)">
              Sim, sou brasileiro(a)
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="nacionalidade" value="estrangeiro"
                class="accent-blue-600 w-4 h-4" onchange="alternarDocumento(this.value)">
              Não, sou estrangeiro(a)
            </label>
          </div>
        </div>

        <!-- CPF (brasileiro) -->
        <div id="campo-cpf">
          <label for="cpf" class="block mb-2 font-semibold">CPF <span class="text-red-600">*</span></label>
          <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14"
            class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Passaporte (estrangeiro) -->
        <div id="campo-passaporte" class="hidden">
          <label for="passaporte" class="block mb-2 font-semibold">Número do Passaporte <span class="text-red-600">*</span></label>
          <input type="text" id="passaporte" placeholder="Ex: AB1234567"
            class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- SENHA -->
        <div>
          <label for="senha" class="block mb-2 font-semibold">Senha <span class="text-red-600">*</span></label>
          <input type="password" id="senha" required placeholder="Mínimo 8 caracteres"
            class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <p class="text-xs text-gray-400 mt-1">Mínimo de 8 caracteres</p>
        </div>

        <!-- ACEITE DOS TERMOS -->
        <div class="flex items-start gap-3">
          <input
            type="checkbox"
            id="aceite-termos"
            required
            class="mt-1 w-4 h-4 accent-blue-600 flex-shrink-0 cursor-pointer"
          >
          <label for="aceite-termos" class="text-sm text-gray-700 cursor-pointer">
            Li e aceito os
            <a href="termos.html" target="_blank" class="text-blue-600 hover:underline font-semibold">
              Termos de Uso e Política de Privacidade
            </a>
            da Remigio Eventos e Serviços, incluindo a autorização de uso de imagem e o
            tratamento de dados pessoais conforme a LGPD.
            <span class="text-red-600">*</span>
          </label>
        </div>

        <!-- BOTÃO -->
        <button type="submit" id="botao-enviar"
          class="bg-blue-600 hover:bg-blue-700 transition text-white px-6 py-3 rounded-lg font-semibold w-full disabled:opacity-50 disabled:cursor-not-allowed">
          Criar conta
        </button>

      </form>

      <!-- FEEDBACK -->
      <div id="feedback-sucesso" class="hidden mt-6 bg-green-50 border border-green-200 rounded-lg p-4 text-center">
        <p class="text-green-700 font-bold">✅ Cadastro realizado com sucesso! Redirecionando...</p>
      </div>

      <div id="feedback-erro" class="hidden mt-6 bg-red-50 border border-red-200 rounded-lg p-4">
        <p id="mensagem-erro" class="text-red-700 font-semibold"></p>
        <p id="sugestao-login" class="hidden text-sm mt-2">
          Você já tem conta?
          <a href="login.html" class="text-blue-600 hover:underline font-semibold">Fazer login</a> ·
          <a href="esqueci-senha.html" class="text-blue-600 hover:underline font-semibold">Esqueci minha senha</a>
        </p>
      </div>

      <p class="mt-6 text-center text-gray-600">
        Já tem conta?
        <a href="login.html" class="text-blue-600 hover:underline font-semibold">Fazer login</a>
      </p>

    </section>

  </main>

  <script>

    // Menu mobile gerenciado por js/header.js

    // Alterna entre CPF e Passaporte
    function alternarDocumento(tipo) {
      const campoCpf       = document.getElementById("campo-cpf");
      const campoPassaporte = document.getElementById("campo-passaporte");
      const inputCpf        = document.getElementById("cpf");
      const inputPassaporte = document.getElementById("passaporte");

      if (tipo === "brasileiro") {
        campoCpf.classList.remove("hidden");
        campoPassaporte.classList.add("hidden");
        inputCpf.required = true;
        inputPassaporte.required = false;
      } else {
        campoCpf.classList.add("hidden");
        campoPassaporte.classList.remove("hidden");
        inputCpf.required = false;
        inputPassaporte.required = true;
      }
    }

    // Máscara de CPF: 000.000.000-00
    document.getElementById("cpf").addEventListener("input", function () {
      let v = this.value.replace(/\D/g, "").slice(0, 11);
      if (v.length > 9)      v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, "$1.$2.$3-$4");
      else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/,        "$1.$2.$3");
      else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/,               "$1.$2");
      this.value = v;
    });

    // Máscara de telefone: +55 82 9 9655-8114
    document.getElementById("telefone").addEventListener("input", function () {
      // deixa só o que o usuário digitou, sem forçar máscara rígida
      // valida no submit
    });

    // FORMULÁRIO
    const formCadastro  = document.getElementById("form-cadastro");
    const feedbackSuces = document.getElementById("feedback-sucesso");
    const feedbackErro  = document.getElementById("feedback-erro");
    const mensagemErro  = document.getElementById("mensagem-erro");
    const sugestaoLogin = document.getElementById("sugestao-login");
    const botaoEnviar   = document.getElementById("botao-enviar");

    formCadastro.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (botaoEnviar.disabled) return;

      feedbackSuces.classList.add("hidden");
      feedbackErro.classList.add("hidden");
      sugestaoLogin.classList.add("hidden");

      const nacionalidade = document.querySelector('input[name="nacionalidade"]:checked').value;
      const isBrasileiro  = nacionalidade === "brasileiro";
      const documento     = isBrasileiro
        ? document.getElementById("cpf").value.replace(/\D/g, "") // remove máscara para enviar só números
        : document.getElementById("passaporte").value.trim();

      if (!documento) {
        mensagemErro.textContent = isBrasileiro ? "❌ CPF é obrigatório." : "❌ Número do passaporte é obrigatório.";
        feedbackErro.classList.remove("hidden");
        return;
      }

      const dados = {
        nome:          document.getElementById("nome").value.trim(),
        email:         document.getElementById("email").value.trim(),
        cpf:           documento, // campo unificado no backend
        tipoDocumento: isBrasileiro ? "cpf" : "passaporte",
        telefone:      document.getElementById("telefone").value.trim(),
        senha:         document.getElementById("senha").value,
      };

      botaoEnviar.disabled = true;
      botaoEnviar.textContent = "Cadastrando...";

      try {
        const resultado = await apiFetch("/api/usuarios", {
          method: "POST",
          body: JSON.stringify(dados),
        });

        sessionStorage.setItem("usuario", JSON.stringify(resultado.usuario));
        feedbackSuces.classList.remove("hidden");
        formCadastro.reset();

        setTimeout(() => { window.location.href = "area-usuario.html"; }, 1500);

      } catch (erro) {
        mensagemErro.textContent = `❌ ${erro.message}`;
        feedbackErro.classList.remove("hidden");

        // Se for conflito de dados, sugere login
        if (erro.message.includes("Não foi possível criar")) {
          sugestaoLogin.classList.remove("hidden");
        }

      } finally {
        botaoEnviar.disabled = false;
        botaoEnviar.textContent = "Criar conta";
      }
    });

  </script>

</body>
</html>
