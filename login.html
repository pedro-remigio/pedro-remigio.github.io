<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login</title>

  <link
    rel="icon"
    type="image/png"
    href="./assets/images/logo.png"
  >

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./js/api.js"></script>
  <script src="./js/header.js"></script>

</head>

<body class="bg-gray-100 text-gray-800">

  <!-- HEADER compartilhado (gerado por js/header.js) -->
  <div id="header-root" data-voltar="index.html"></div>

  <!-- MAIN -->
  <main class="container mx-auto pt-44 pb-16 px-6">

    <section class="bg-white p-8 rounded-xl shadow-lg max-w-md mx-auto">

      <h2 class="text-4xl font-bold mb-6">
        Login
      </h2>

      <!-- FORM -->
      <form
        id="form-login"
        class="space-y-5"
      >

        <!-- EMAIL -->
        <div>

          <label
            for="email"
            class="block mb-2 font-semibold"
          >
            Email
            <span class="text-red-600">*</span>
          </label>

          <input
            type="email"
            id="email"
            required
            placeholder="Digite seu email"
            class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >

        </div>

        <!-- SENHA -->
        <div>

          <label
            for="senha"
            class="block mb-2 font-semibold"
          >
            Senha
            <span class="text-red-600">*</span>
          </label>

          <input
            type="password"
            id="senha"
            required
            placeholder="Digite sua senha"
            class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >

        </div>

        <div class="flex items-center justify-between">
          <button
            type="submit"
            id="botao-enviar"
            class="bg-blue-600 hover:bg-blue-700 transition text-white px-6 py-3 rounded-lg font-semibold disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Entrar
          </button>
          <a href="esqueci-senha.html" class="text-sm text-blue-600 hover:underline">Esqueci minha senha</a>
        </div>

      </form>

      <!-- FEEDBACK -->
      <p
        id="mensagem-sucesso"
        class="hidden text-green-600 mt-6 font-bold text-center"
      >
      </p>

      <p
        id="mensagem-erro"
        class="hidden text-red-600 mt-6 font-bold text-center"
      >
      </p>

      <p class="mt-6 text-center">
        Ainda não tem conta?
        <a href="cadastro.html" class="text-blue-600 hover:underline font-semibold">
          Cadastre-se
        </a>
      </p>

    </section>

  </main>

  <script>

    // FORMULÁRIO
    // Menu mobile gerenciado por js/header.js
    // API_URL e apiFetch vêm de js/api.js (carregado no <head>)

    const formLogin = document.getElementById("form-login");
    const mensagemSucesso = document.getElementById("mensagem-sucesso");
    const mensagemErro = document.getElementById("mensagem-erro");
    const botaoEnviar = document.getElementById("botao-enviar");

    formLogin.addEventListener("submit", async (event) => {

      event.preventDefault();

      if (botaoEnviar.disabled) return;

      mensagemSucesso.classList.add("hidden");
      mensagemErro.classList.add("hidden");

      const dados = {
        email: document.getElementById("email").value,
        senha: document.getElementById("senha").value,
      };

      botaoEnviar.disabled = true;
      botaoEnviar.textContent = "Entrando...";

      try {

        // apiFetch já envia credentials: "include" (cookie de sessão)
        const resultado = await apiFetch("/api/usuarios/login", {
          method: "POST",
          body: JSON.stringify(dados),
        });

        // Salva nome para exibir no front sem precisar buscar na API toda hora
        sessionStorage.setItem("usuario", JSON.stringify(resultado.usuario));

        mensagemSucesso.textContent = `✅ Bem-vindo(a), ${resultado.usuario.nome}!`;
        mensagemSucesso.classList.remove("hidden");

        formLogin.reset();

        setTimeout(() => {
          window.location.href = "area-usuario.html";
        }, 1200);

      } catch (erro) {

        mensagemErro.textContent = `❌ ${erro.message}`;
        mensagemErro.classList.remove("hidden");

      } finally {

        botaoEnviar.disabled = false;
        botaoEnviar.textContent = "Entrar";

      }

    });

  </script>

</body>
</html>
