<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagamento não realizado — Remigio Eventos</title>
  <link rel="icon" type="image/png" href="./assets/images/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-6">

  <div class="text-center max-w-md w-full bg-white rounded-2xl shadow-lg p-8">
    <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
      <svg class="w-10 h-10 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-900 mb-2">Pagamento não realizado</h1>
    <p class="text-gray-500 mb-6">
      Seu pagamento foi recusado ou cancelado. Não se preocupe — sua inscrição está reservada
      e você pode tentar novamente.
    </p>
    <div class="flex flex-col gap-3">
      <button
        onclick="history.back()"
        class="bg-blue-600 hover:bg-blue-700 transition text-white px-6 py-3 rounded-xl font-semibold"
      >
        Tentar novamente
      </button>
      <a href="index.html" class="text-gray-500 hover:text-gray-700 transition text-sm">
        Voltar para a página inicial
      </a>
    </div>
  </div>

</body>
</html>
