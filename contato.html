<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Contato</title>

  <link
    rel="icon"
    type="image/png"
    href="./assets/images/logo.png"
  >

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./js/api.js"></script>
  <script src="./js/header.js"></script>

</head>

<body class="bg-gray-100 text-gray-800">

  <!-- HEADER compartilhado (gerado por js/header.js) -->
  <div id="header-root" data-voltar="index.html"></div>

  <!-- MAIN -->
  <main class="container mx-auto pt-44 pb-16 px-6">

    <section class="bg-white p-8 rounded-xl shadow-lg max-w-2xl mx-auto">

      <h2 class="text-4xl font-bold mb-6">
        Contato
      </h2>

      <p class="mb-2 text-lg">
        📧 remigio.pedro@gmail.com
      </p>

      <p class="mb-8 text-lg">
        📱 (82) 99655-8114
      </p>

      <!-- FORM -->
      <form
        id="form-contato"
        class="space-y-5"
      >

        <!-- NOME -->
        <div>

          <label
            for="nome"
            class="block mb-2 font-semibold"
          >
            Nome
            <span class="text-red-600">*</span>
          </label>

          <input
            type="text"
            id="nome"
            required
            placeholder="Digite seu nome"
            class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >

        </div>

        <!-- EMAIL -->
        <div>

          <label
            for="email"
            class="block mb-2 font-semibold"
          >
            Email
            <span class="text-red-600">*</span>
          </label>

          <input
            type="email"
            id="email"
            required
            placeholder="Digite seu email"
            class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >

        </div>

        <!-- TELEFONE -->
        <div>

          <label for="telefone" class="block mb-2 font-semibold">
            Telefone / WhatsApp <span class="text-red-600">*</span>
          </label>

          <input
            type="tel"
            id="telefone"
            required
            placeholder="+55 82 9 9655-8114"
            class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
          <p class="text-xs text-gray-400 mt-1">Informe seu WhatsApp para retorno mais rápido.</p>

        </div>

        <!-- EVENTO -->
        <div>

          <label for="evento" class="block mb-2 font-semibold">
            Evento <span class="text-red-600">*</span>
          </label>

          <input
            type="text"
            id="evento"
            required
            placeholder="Ex: Tech Summit 2026"
            class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >

        </div>

        <!-- MENSAGEM -->
        <div>

          <label
            for="mensagem"
            class="block mb-2 font-semibold"
          >
            Mensagem
            <span class="text-red-600">*</span>
          </label>

          <textarea
            id="mensagem"
            rows="5"
            required
            placeholder="Digite sua mensagem"
            class="w-full border border-gray-300 rounded-lg p-3 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500"
          ></textarea>

        </div>

        <!-- BOTÃO -->
        <button
          type="submit"
          id="botao-enviar"
          class="bg-blue-600 hover:bg-blue-700 transition text-white px-6 py-3 rounded-lg font-semibold w-full md:w-auto disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Enviar Mensagem
        </button>

      </form>

      <!-- FEEDBACK -->
      <p
        id="mensagem-sucesso"
        class="hidden text-green-600 mt-6 font-bold text-center"
      >
        ✅ Mensagem enviada com sucesso!
      </p>

      <p
        id="mensagem-erro"
        class="hidden text-red-600 mt-6 font-bold text-center"
      >
      </p>

    </section>

  </main>

  <script>

    // FORMULÁRIO — API_URL e apiFetch vêm de js/api.js
    // Menu mobile gerenciado por js/header.js

    // Pré-preenchimento via URL (usado pela área do usuário para dados sensíveis)
    (function () {
      const p = new URLSearchParams(window.location.search);
      if (p.get("nome"))    document.getElementById("nome").value    = p.get("nome");
      if (p.get("email"))   document.getElementById("email").value   = p.get("email");
      if (p.get("evento"))  document.getElementById("evento").value  = p.get("evento");

      // Se veio da solicitação de dados sensíveis, ajusta label/placeholder e mostra aviso
      if (p.get("assunto") === "sensivel") {
        const label = document.querySelector("label[for='evento']");
        const input = document.getElementById("evento");
        if (label) label.innerHTML = `Assunto <span class="text-red-600">*</span>`;
        if (input) input.placeholder = "Ex: Alteração de e-mail / Alteração de CPF";
        const aviso = document.createElement("div");
        aviso.className = "mb-6 bg-yellow-50 border border-yellow-300 rounded-xl p-4 text-sm text-yellow-800";
        aviso.innerHTML = `
          <strong>📋 Solicitação de alteração de dados sensíveis</strong><br>
          Descreva na mensagem abaixo qual informação deseja alterar e o novo valor.
          Nossa equipe responderá em até 2 dias úteis.
        `;
        document.getElementById("form-contato").prepend(aviso);
      }
    })();

    const formContato = document.getElementById("form-contato");
    const mensagemSucesso = document.getElementById("mensagem-sucesso");
    const mensagemErro = document.getElementById("mensagem-erro");
    const botaoEnviar = document.getElementById("botao-enviar");

    formContato.addEventListener("submit", async (event) => {

      event.preventDefault();

      if (botaoEnviar.disabled) return;

      mensagemSucesso.classList.add("hidden");
      mensagemErro.classList.add("hidden");

      const dados = {
        nome:     document.getElementById("nome").value,
        email:    document.getElementById("email").value,
        telefone: document.getElementById("telefone").value.trim(),
        evento:   document.getElementById("evento").value,
        mensagem: document.getElementById("mensagem").value,
      };

      botaoEnviar.disabled = true;
      botaoEnviar.textContent = "Enviando...";

      try {

        await apiFetch("/api/leads", {
          method: "POST",
          body: JSON.stringify(dados),
        });

        mensagemSucesso.classList.remove("hidden");
        formContato.reset();

        setTimeout(() => {
          mensagemSucesso.classList.add("hidden");
        }, 4000);

      } catch (erro) {

        mensagemErro.textContent = `❌ ${erro.message}`;
        mensagemErro.classList.remove("hidden");

      } finally {

        botaoEnviar.disabled = false;
        botaoEnviar.textContent = "Enviar Mensagem";

      }

    });

  </script>

</body>
</html>
