server {
    listen 80;
    server_name localhost;

    # Diretório raiz dos arquivos estáticos do frontend
    root /usr/share/nginx/html;
    index index.html;

    # ─── Proxy: API pública ───────────────────────────────────────────────────
    # Todas as chamadas /api/* são repassadas para o container "backend"
    # O browser enxerga tudo na mesma origem (localhost:80) → sem problema de CORS
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Repassa cookies de sessão
        proxy_pass_header  Set-Cookie;
    }

    # ─── Proxy: painel do administrador ──────────────────────────────────────
    location /admin {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_header  Set-Cookie;
    }

    # ─── Arquivos estáticos do frontend ──────────────────────────────────────
    location / {
        # Tenta servir o arquivo exato, depois adiciona .html, senão retorna 404
        try_files $uri $uri/ $uri.html =404;
    }

    # ─── Segurança: bloqueia acesso a arquivos ocultos (.env, .git etc.) ─────
    location ~ /\. {
        deny all;
    }
}
